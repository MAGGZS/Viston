version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: viston_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viston
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Opcional: Supabase Storage local via MinIO (compatível com S3)
  # Descomente se quiser testar upload de arquivos localmente sem Supabase CLI
  # minio:
  #   image: minio/minio:latest
  #   container_name: viston_minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - '9000:9000'
  #     - '9001:9001'
  #   volumes:
  #     - minio_data:/data

volumes:
  postgres_data:
  # minio_data:
