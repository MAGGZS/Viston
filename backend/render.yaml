services:
  - type: web
    name: viston-api
    env: node
    region: frankfurt  # Mais próximo de sa-east-1 (São Paulo) disponível no plano free
                     # Trocar para "oregon" se frankfurt não estiver disponível no seu plano
                     # Render regiões: oregon, frankfurt, singapore, ohio
    plan: free
    # `--include=dev` é obrigatório: NODE_ENV=production (logo abaixo) faz o npm
    # pular as devDependencies, e é lá que moram `typescript` e os `@types/*`.
    # Sem eles o import de express fica sem tipo e, como o tsconfig tem
    # `noImplicitAny: false`, vira `any` calado — o build quebra com dezenas de
    # "Property 'body' does not exist", longe da causa real.
    # `npm run build` já roda `prisma generate` — não precisa repetir.
    buildCommand: npm ci --include=dev && npm run build && npm run prisma:migrate:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_EXCEL
        value: viston-excel
      - key: SUPABASE_BUCKET_PHOTOS
        value: viston-photos
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
