services:
  - type: web
    name: viston-api
    env: node
    region: frankfurt  # Mais próximo de sa-east-1 (São Paulo) disponível no plano free
                     # Trocar para "oregon" se frankfurt não estiver disponível no seu plano
                     # Render regiões: oregon, frankfurt, singapore, ohio
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run build && npm run prisma:migrate:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_EXCEL
        value: viston-excel
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
