services:
  - type: web
    name: viston-api
    env: node
    region: frankfurt  # Mais próximo de sa-east-1 (São Paulo) disponível no plano free
                     # Trocar para "oregon" se frankfurt não estiver disponível no seu plano
                     # Render regiões: oregon, frankfurt, singapore, ohio
    plan: free
    # `npm ci` e não `npm install`: o install aceita um node_modules que já
    # exista (o cache do Render), e quando esse cache tem versões diferentes das
    # do package-lock o build quebra em erro de tipo. O ci apaga e reconstrói
    # exatamente o que está no lockfile.
    # `npm run build` já roda `prisma generate` — não precisa repetir.
    buildCommand: npm ci && npm run build && npm run prisma:migrate:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_EXCEL
        value: viston-excel
      - key: SUPABASE_BUCKET_PHOTOS
        value: viston-photos
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
