services:
  - type: web
    name: viston-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run build && npm run prisma:migrate:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_PHOTOS
        value: viston-photos
      - key: SUPABASE_BUCKET_EXCEL
        value: viston-excel
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GOOGLE_FORM_URL
        sync: false
      - key: GOOGLE_FORM_FIELD_ITEM_NAME
        sync: false
      - key: GOOGLE_FORM_FIELD_QUANTITY
        sync: false
      - key: GOOGLE_FORM_FIELD_IS_MARKED
        sync: false
      - key: GOOGLE_FORM_FIELD_STATUS
        sync: false
      - key: GOOGLE_FORM_FIELD_OBSERVATION
        sync: false
      - key: FRONTEND_URL
        sync: false
