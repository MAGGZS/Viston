services:
  - type: web
    name: viston-api
    env: node
    # O serviço roda em oregon — conferido na API do Render. O arquivo dizia
    # frankfurt, e a divergência importa: recriar o serviço pelo blueprint o
    # moveria de região sem ninguém pedir.
    #
    # Nenhuma das regiões do plano free fica perto do banco (Supabase em
    # sa-east-1, São Paulo), então a ida e volta custa o que custa. Trocar de
    # região não vale o risco de recriar o serviço; se um dia a latência
    # incomodar, o caminho é aproximar banco e aplicação, não trocar um oceano
    # por outro.
    region: oregon
                     # Render regiões: oregon, frankfurt, singapore, ohio
    plan: free
    # `--include=dev` é obrigatório: NODE_ENV=production (logo abaixo) faz o npm
    # pular as devDependencies, e é lá que moram `typescript` e os `@types/*`.
    # Sem eles o import de express fica sem tipo e, como o tsconfig tem
    # `noImplicitAny: false`, vira `any` calado — o build quebra com dezenas de
    # "Property 'body' does not exist", longe da causa real.
    # `npm run build` já roda `prisma generate` — não precisa repetir.
    buildCommand: npm ci --include=dev && npm run build && npm run prisma:migrate:deploy
    startCommand: npm start
    # O Render passa a saber quando a instância está viva de verdade, e não só
    # quando o processo existe: `/health` responde 200 sem tocar no banco.
    # Estava vazio, e sem isso um processo que subiu mas não responde continua
    # marcado como saudável.
    #
    # `/health` e não `/health/ready`: o segundo faz `SELECT 1`, e uma queda
    # momentânea do banco derrubaria a instância inteira em vez de deixá-la
    # responder o que não depende de banco.
    healthCheckPath: /health
    envVars:
      # O cliente do Supabase usa o WebSocket nativo do Node, que só existe a
      # partir do 22 — numa versão anterior ele quebra na carga do módulo, e o
      # serviço nem sobe. Mesmo piso do `engines` no package.json.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_EXCEL
        value: viston-excel
      - key: SUPABASE_BUCKET_PHOTOS
        value: viston-photos
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      # Brevo, API HTTPS. `sync: false` — o valor entra pelo painel, e segredo
      # nenhum mora neste arquivo.
      #
      # HTTPS e nao SMTP porque o Render bloqueia saida SMTP: 465 e 587 foram
      # testadas aqui e as duas deram ETIMEDOUT. A API fala na 443.
      #
      # Use uma chave por lugar — uma para a maquina de quem desenvolve, outra
      # para producao. Revogar uma nao derruba a outra.
      - key: BREVO_API_KEY
        sync: false
      # So o endereco, e precisa ser remetente verificado no painel da Brevo.
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Viston
