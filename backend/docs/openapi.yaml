openapi: 3.0.3
info:
  title: Viston API
  description: |
    Backend do sistema de gestão de vistorias prediais Viston.
    
    ## Autenticação
    Todas as rotas (exceto `/auth/login` e `/auth/refresh`) requerem Bearer token JWT.
    
    ## Papéis
    São dois eixos independentes.

    **Papel da conta** (`user.role`), com dois valores:
    - **ADMIN**: conta de suporte do sistema. Passa por qualquer prédio e
      administra contas. Não tem prédio próprio.
    - **NONE**: todas as outras contas. Não autoriza nada por si.

    **Papel no prédio** (`BuildingMember.role`), que é onde mora toda a
    autorização do produto:
    - **GESTOR**: administra o prédio — andares, colaboradores, solicitações,
      descarte de vistoria. Um prédio pode ter mais de um; nunca zero.
    - **INSPECTOR**: vistoria o prédio.
    - **VIEWER**: só acompanha.

    A mesma conta pode ser GESTOR de um prédio e VIEWER de outro. Por isso o JWT
    carrega só `sub` e o papel da conta: o papel de prédio é consultado por
    requisição. `buildings.created_by` é histórico de quem cadastrou e não
    autoriza nada.

    ## Isolamento por prédio
    Fora o ADMIN, todo acesso a dados de um prédio exige vínculo
    (`BuildingMember`). Sem vínculo: `403` nas rotas de prédio e `404` nos
    relatórios — o relatório de outro prédio se comporta como inexistente.
    Listagens (`/inspections`, `/calendar`) só trazem os prédios do usuário.

    ## Limites de requisição
    - Geral: 300 req/min por IP
    - `/auth/*`: 20 tentativas por 15 min (sucesso não conta)
    - Cadastro, `/buildings/lookup` e pedido de acesso: 60/h por IP

    Estouro devolve `429` com o corpo de erro padrão.

    ## Erros padronizados
    Todos os erros seguem o formato: `{ "error": { "code": "string", "message": "string" } }`
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
  - url: https://viston-api.onrender.com
    description: Produção (Render)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, NONE], description: 'Papel da conta no sistema, não no prédio' }
        avatar_url: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, DELETED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        memberships:
          type: array
          description: Vínculos do usuário. Só em `/users/me` e na resposta do login.
          items: { $ref: '#/components/schemas/Membership' }

    Membership:
      type: object
      properties:
        building_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        role: { type: string, enum: [GESTOR, INSPECTOR, VIEWER] }
        joined_at: { type: string, format: date-time }

    Feedback:
      type: object
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
        status:
          type: string
          enum: [PENDENTE, TAREFA, MENSAGEM]
          description: >
            Onde o feedback está na caixa do admin. Nasce PENDENTE; vira TAREFA
            (algo a fazer) ou MENSAGEM (elogio, que só se lê). Descartado não é
            um status — a linha é apagada.
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
        author:
          type: object
          nullable: true
          description: >
            Quem mandou, já resolvido pelo servidor — o feedback pode vir de uma
            conta de usuário ou de uma de gestor. Nulo quando a conta saiu do
            sistema; o feedback continua valendo. Só nas rotas do ADMIN.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            avatar_url: { type: string, nullable: true }
            kind: { type: string, enum: [USER, MANAGER] }

    MyFeedback:
      type: object
      description: >
        O envio como quem mandou o vê. Sem `status` e sem `reviewed_at` de
        propósito: o destino que o admin deu é decisão de trabalho dele, e o
        que ele descarta some da lista porque a linha deixa de existir.
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
        created_at: { type: string, format: date-time }

    Floor:
      type: object
      properties:
        id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        label: { type: string, example: "6º Andar" }
        order: { type: integer, example: 6 }

    MaintenanceRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        maintenance_type:
          type: string
          enum: [AR_CONDICIONADO, CIVIL, ELETRICA, EQUIPAMENTO, EVENTOS, HIDRELETRICA, HIGIENIZACAO_LIMPEZA, INFILTRACAO, MARCENARIA, MOVEIS_CADEIRAS, PINTURA, PROJETOR, VAZAMENTO]
        category: { type: string, enum: [PREVENTIVA, CORRETIVA, EMERGENCIAL, EVENTOS, PROJETOS] }
        priority: { type: string, enum: [ALTA, MEDIA, BAIXA] }
        description: { type: string }
        responsible: { type: string, enum: [Alan, Ailton, Gislaine, Gustavo, Rossi, Felipe, Vanessa] }
        status: { type: string, enum: [ABERTO, EM_ANDAMENTO, AGUARDANDO_TERCEIRO, CONCLUIDO] }
        created_at: { type: string, format: date-time }

    FloorFormEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        floor_id: { type: string, format: uuid }
        status_geral:
          type: string
          enum: [OK, ATENCAO, PROBLEMA]
          description: Derivado da maior prioridade relatada no andar (ALTA=PROBLEMA, MEDIA=ATENCAO)
        completed_at: { type: string, format: date-time }
        floor: { $ref: '#/components/schemas/Floor' }
        maintenance_records:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceRecord' }

    InspectionReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        inspector_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        date: { type: string, format: date }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        floors_inspected: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED] }
        excel_url: { type: string, format: uri, nullable: true }
        google_form_synced: { type: boolean }
        google_form_synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        inspector: { $ref: '#/components/schemas/User' }
        building:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        floor_form_entries:
          type: array
          items: { $ref: '#/components/schemas/FloorFormEntry' }

    MaintenanceRecordPayload:
      type: object
      required: [maintenance_type, category, priority, description, responsible]
      properties:
        maintenance_type:
          type: string
          enum: [AR_CONDICIONADO, CIVIL, ELETRICA, EQUIPAMENTO, EVENTOS, HIDRELETRICA, HIGIENIZACAO_LIMPEZA, INFILTRACAO, MARCENARIA, MOVEIS_CADEIRAS, PINTURA, PROJETOR, VAZAMENTO]
        category: { type: string, enum: [PREVENTIVA, CORRETIVA, EMERGENCIAL, EVENTOS, PROJETOS] }
        priority: { type: string, enum: [ALTA, MEDIA, BAIXA] }
        description: { type: string, maxLength: 2000 }
        responsible: { type: string, enum: [Alan, Ailton, Gislaine, Gustavo, Rossi, Felipe, Vanessa] }
        status:
          type: string
          enum: [ABERTO, EM_ANDAMENTO, AGUARDANDO_TERCEIRO, CONCLUIDO]
          default: ABERTO

    SubmitInspectionPayload:
      type: object
      required: [building_id, floors]
      description: >
        Vistoria completa em um único envio. O app mantém os andares em memória
        e só manda tudo quando o inspetor conclui o último andar.
      properties:
        building_id: { type: string, format: uuid }
        floors:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [floor_id]
            properties:
              floor_id: { type: string, format: uuid }
              records:
                type: array
                maxItems: 20
                default: []
                items: { $ref: '#/components/schemas/MaintenanceRecordPayload' }

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        '401':
          description: Refresh token inválido

  /users:
    post:
      tags: [Users]
      summary: Cadastro público
      description: |
        Rota aberta, sem token. A conta nasce sem vínculo nenhum (`role: NONE`).
        O papel dela aparece dentro de um prédio: criando um (vira GESTOR dele)
        ou sendo aprovada num pela chave de compartilhamento (entra VIEWER).
        Campos fora do contrato fazem a requisição falhar com 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 160 }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '201':
          description: Usuário criado (sempre sem vínculo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Payload inválido (inclui tentativa de enviar `role`)
        '409':
          description: E-mail já cadastrado
        '429':
          description: Limite de cadastros por IP atingido
    get:
      tags: [Users]
      summary: Listar usuários (ADMIN only)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/User' } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }

  /users/{id}:
    patch:
      tags: [Users]
      summary: Atualizar nome/status de usuário (ADMIN only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                status: { type: string, enum: [ACTIVE, DELETED] }
              description: |
                `role` não entra aqui. Quem define o que a pessoa faz num prédio
                é um gestor daquele prédio, em
                `PATCH /buildings/{id}/members/{userId}`.
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users/me:
    get:
      tags: [Users]
      summary: Obter dados do usuário autenticado
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Users]
      summary: Atualizar nome/e-mail do usuário autenticado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '200':
          description: Usuário atualizado
    delete:
      tags: [Users]
      summary: Soft delete da própria conta (anonimização)
      responses:
        '204':
          description: Conta anonimizada com sucesso

  /users/me/password:
    patch:
      tags: [Users]
      summary: Alterar senha do usuário autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '204':
          description: Senha alterada com sucesso
        '401':
          description: Senha atual incorreta

  /feedbacks:
    post:
      tags: [Feedback]
      summary: Mandar uma sugestão ao administrador
      description: |
        Aberta a qualquer conta autenticada, das duas naturezas — usuário e
        gestor mandam pela mesma rota, e o servidor grava a autoria na coluna da
        tabela certa. Sem limite de quantidade por conta: quem tem duas coisas a
        dizer manda duas vezes. O feedback nasce PENDENTE; `status` no corpo faz
        a requisição falhar com 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 5, maxLength: 2000 }
      responses:
        '201':
          description: Feedback registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '400':
          description: Payload inválido (mensagem curta demais ou campo fora do contrato)
        '429':
          description: Limite de envios por IP atingido
    get:
      tags: [Feedback]
      summary: Caixa de feedbacks (ADMIN only)
      description: Uma aba por status. `pending` acompanha a resposta porque o aviso vive no menu, fora da aba aberta.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDENTE, TAREFA, MENSAGEM], default: PENDENTE }
      responses:
        '200':
          description: Feedbacks do status pedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedbacks: { type: array, items: { $ref: '#/components/schemas/Feedback' } }
                  pending: { type: integer, description: Quantos ainda não foram lidos }
        '403':
          description: Rota restrita ao ADMIN

  /feedbacks/me:
    get:
      tags: [Feedback]
      summary: Os próprios envios
      description: >
        O que a conta autenticada já mandou. Sem autoria — ela já é conhecida —
        e sem o destino que o admin deu a cada um.
      responses:
        '200':
          description: Lista dos envios, do mais novo para o mais velho
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyFeedback' }

  /feedbacks/{id}:
    patch:
      tags: [Feedback]
      summary: Receber como tarefa ou mover para mensagens (ADMIN only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [TAREFA, MENSAGEM]
                  description: PENDENTE não entra — é de onde o feedback sai, não para onde ele volta.
      responses:
        '200':
          description: Feedback movido de aba
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '403':
          description: Rota restrita ao ADMIN
        '404':
          description: Feedback não encontrado
    delete:
      tags: [Feedback]
      summary: Descartar o feedback (ADMIN only)
      description: Apaga a linha. Vale para o pendente descartado, a tarefa concluída e a mensagem excluída — nada disso volta.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Feedback apagado
        '403':
          description: Rota restrita ao ADMIN
        '404':
          description: Feedback não encontrado

  /buildings/{id}/floors:
    get:
      tags: [Buildings]
      summary: Listar andares de um prédio (ordenados do 6 ao -5)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Prédio e lista de andares
          content:
            application/json:
              schema:
                type: object
                properties:
                  building:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                  floors:
                    type: array
                    items: { $ref: '#/components/schemas/Floor' }

  /inspections:
    post:
      tags: [Inspections]
      summary: Enviar vistoria completa — grava, gera Excel e publica no histórico (GESTOR/INSPECTOR do prédio)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitInspectionPayload' }
      responses:
        '201':
          description: Vistoria registrada como COMPLETED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionReport' }
        '400':
          description: Payload inválido
        '409':
          description: Andar repetido ou andar que não pertence ao prédio
    get:
      tags: [Inspections]
      summary: Histórico de inspeções (apenas COMPLETED por padrão)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [IN_PROGRESS, COMPLETED] }
        - in: query
          name: inspector_id
          schema: { type: string, format: uuid }
        - in: query
          name: floor_id
          schema: { type: string, format: uuid }
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Lista paginada de inspeções
          content:
            application/json:
              schema:
                type: object
                properties:
                  inspections: { type: array, items: { $ref: '#/components/schemas/InspectionReport' } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  pages: { type: integer }

  /inspections/{id}:
    get:
      tags: [Inspections]
      summary: Obter inspeção por ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dados completos da inspeção
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionReport' }
        '404':
          description: Inspeção não encontrada

  /inspections/{id}/excel:
    get:
      tags: [Inspections]
      summary: Obter URL do Excel gerado
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: URL do arquivo Excel
          content:
            application/json:
              schema:
                type: object
                properties:
                  excel_url: { type: string, format: uri }
        '404':
          description: Excel ainda não gerado

  /calendar:
    get:
      tags: [Calendar]
      summary: Heatmap de atividade de inspeções
      parameters:
        - in: query
          name: month
          schema: { type: integer, minimum: 1, maximum: 12 }
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: range
          schema: { type: string, enum: [semestral, anual] }
      responses:
        '200':
          description: Heatmap de atividade
          content:
            application/json:
              schema:
                type: object
                properties:
                  date_from: { type: string, format: date-time }
                  date_to: { type: string, format: date-time }
                  heatmap:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count: { type: integer }
                        inspectors: { type: array, items: { type: string } }
                    example:
                      "2024-01-15":
                        count: 2
                        inspectors: ["Carlos Inspetor", "Ana Inspetora"]
